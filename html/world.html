<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Are We, at 250</title>
<link rel="stylesheet" href="../css/world.css"></head><body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="ov" aria-label="A globe of visas issued by the United States: one dot is 50 visas, coloured by type, gathered in each country; hairline arcs show where they fly; red marks removals"></canvas>
<canvas id="ln" aria-label="Net international migration to the United States, years ending 1 July 2011–2025, and the published projections for 2026, drawn as a bundle of hairlines"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<nav class="ui" id="nav" aria-label="Views"><button type="button" data-c="line"><i>01</i>The line</button><button type="button" data-c="world"><i>02</i>The world</button><button type="button" data-c="us"><i>03</i>The US</button><button type="button" data-c="city"><i>04</i>The cities</button></nav>
<div class="ui" id="head" hidden><div class="kick" id="hkick"></div><h1 id="htitle">Who comes</h1><p id="hsub">Visas issued by the United States, by country and type</p></div>
<div class="ui" id="yrbox" hidden><div class="y" id="yr"></div><div class="t" id="tot"></div></div>
<div id="split" hidden><div class="sln"></div><div class="shit" id="shit"></div><button type="button" class="grip" id="grip" aria-label="Drag to compare with and without people from abroad"><span class="a">with</span><i></i><span class="b">without</span></button></div>
<div class="ui" id="legend" hidden></div>
<div class="ui" id="selc" hidden role="region" aria-label="Selected country"></div>
<div class="ui" id="years" role="group" aria-label="Year" hidden></div>
<button type="button" class="ui" id="hint" hidden>Click the United States to see where immigrants land</button>
<button type="button" class="ui b" id="back" hidden>↺ Play the film</button>
<div class="ui" id="dive" hidden><button type="button" class="b" id="divb">See the people in 2024–25 ↓</button><button type="button" class="b" id="land" hidden>Where they land →</button></div>
<div class="ui" id="cap" aria-live="polite"></div>
<div class="ui" id="note" aria-live="polite"></div>
<div class="ui" id="ctrl" hidden><button type="button" class="b" id="pp">Pause</button><button type="button" class="b" id="next">Next →</button></div>
<div id="tip" hidden></div>
<div class="ui" id="evc" hidden role="dialog" aria-label="Event"></div>
<script src="../scripts/load.js" data-base="../"
  data-json="D:data/core.json,D2:data/world-series.json,ST:data/world-states.json,LA:data/los-angeles.json,BOS:data/boston.json,CY:data/cities-h1b-students.json,LPRC:data/green-cards-by-country.json,D3:data/county-population-2024.json,GEO:data/outlines.json"
  data-run="scripts/world.js,scripts/world-embed.js"></script></body></html>
